name: Release

# Push a tag like v1.0.0 and this builds the installers and portable zips for x64 and arm64 on a
# GitHub Windows runner, from the tagged commit, and opens a draft release with them, their
# SHA-256 and the tag's section of CHANGELOG.md as notes. Check the draft, then publish it.
# Run it by hand from the Actions tab to get the same files as a workflow artifact, without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { ([xml](Get-Content src/HouseControl/HouseControl.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Attest build provenance
        # Free accounts get attestations for public repositories only.
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "House Control $version for Windows." }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: HouseControl-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: House Control ${{ steps.version.outputs.version }} for Windows
          body_path: release-notes.md
          files: dist/*
